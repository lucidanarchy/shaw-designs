<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DHK Style Hero Lift Reveal</title>

  <!-- Google Fonts: Cormorant Garamond & Work Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Lenis CSS -->
  <link rel="stylesheet" href="https://unpkg.com/lenis@1.1.18/dist/lenis.css">

  <style>
    body {
      background-color: #0a0a0a;
      color: #f5f5f5;
      font-family: 'Work Sans', sans-serif;
      overflow-x: hidden;
    }

    .font-editorial {
      font-family: 'Cormorant Garamond', serif;
    }

    /* =========================================================
       HERO PING & LIFT SECTION
       ========================================================= */
    .hero-lift-section {
      position: relative;
      height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #0a0a0a;
      z-index: 10;
    }

    /* Big Hero Typography Statement */
    .hero-giant-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(5rem, 15vw, 14rem);
      font-weight: 300;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #ffffff;
      margin: 0;
      line-height: 1;
      text-align: center;
    }

    .hero-subtitle {
      font-size: 0.75rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 1rem;
    }

    /* =========================================================
       THE 3-IMAGE REVEAL GRID (Lifts up over the hero)
       ========================================================= */
    .reveal-content-section {
      position: relative;
      z-index: 20;
      background-color: #0a0a0a;
      padding: 6rem 2rem;
    }

    .triple-image-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .reveal-card {
      position: relative;
      height: 500px;
      overflow: hidden;
      background: #151515;
    }

    .reveal-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.85);
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .reveal-card:hover img {
      transform: scale(1.05);
    }

    .reveal-card-caption {
      position: absolute;
      bottom: 2rem;
      left: 2rem;
      z-index: 5;
    }

    /* Mobile Responsive Stack */
    @media (max-width: 768px) {
      .triple-image-grid {
        grid-template-columns: 1fr;
      }
      .reveal-card {
        height: 400px;
      }
    }
  </style>
</head>
<body>

  <!-- =========================================================
       HERO PIPPED SECTION (Shows Big Title first)
       ========================================================= -->
  <section class="hero-lift-section" id="heroLiftSection">
    <div class="text-center">
      <h1 class="hero-giant-title" id="giantTitle">SHAW</h1>
      <p class="hero-subtitle">Architectural Monograph &mdash; 2026</p>
    </div>
  </section>

  <!-- =========================================================
       THREE-IMAGE REVEAL GRID (Lifts Up)
       ========================================================= -->
  <section class="reveal-content-section" id="revealContent">
    <div class="container-fluid px-lg-5">
      <div class="mb-5 text-center">
        <span class="text-uppercase text-muted d-block mb-2" style="font-size: 0.65rem; letter-spacing: 0.3em;">Selected Portfolio</span>
        <h2 class="font-editorial fw-light display-5 text-white">Featured Spaces</h2>
      </div>

      <div class="triple-image-grid">
        <!-- Image 1 -->
        <div class="reveal-card">
          <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=800&auto=format&fit=crop" alt="Project One">
          <div class="reveal-card-caption">
            <span class="text-white-50 text-uppercase small" style="letter-spacing: 0.2em;">01 / Residential</span>
            <h4 class="font-editorial text-white fw-light fs-4 mb-0">The Glass Pavilion</h4>
          </div>
        </div>

        <!-- Image 2 -->
        <div class="reveal-card">
          <img src="https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?q=80&w=800&auto=format&fit=crop" alt="Project Two">
          <div class="reveal-card-caption">
            <span class="text-white-50 text-uppercase small" style="letter-spacing: 0.2em;">02 / Commercial</span>
            <h4 class="font-editorial text-white fw-light fs-4 mb-0">The Concrete Monolith</h4>
          </div>
        </div>

        <!-- Image 3 -->
        <div class="reveal-card">
          <img src="https://images.unsplash.com/photo-1600566753376-12c8ab7fb75b?q=80&w=800&auto=format&fit=crop" alt="Project Three">
          <div class="reveal-card-caption">
            <span class="text-white-50 text-uppercase small" style="letter-spacing: 0.2em;">03 / Masterplanning</span>
            <h4 class="font-editorial text-white fw-light fs-4 mb-0">Urban Loft Penthouse</h4>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- GSAP & ScrollTrigger CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  
  <!-- Lenis CDN -->
  <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>

  <script>
    // 1. Initialize Lenis Smooth Scroll
    const lenis = new Lenis({
      duration: 1.2,
      smoothWheel: true,
    });

    lenis.on('scroll', ScrollTrigger.update);
    gsap.ticker.add((time) => { lenis.raf(time * 1000); });
    gsap.ticker.lagSmoothing(0);

    // 2. GSAP ScrollTrigger "Lift & Reveal" Animation
    gsap.registerPlugin(ScrollTrigger);

    let tl = gsap.timeline({
      scrollTrigger: {
        trigger: "#heroLiftSection",
        start: "top top",
        end: "+=100%", // Pins for 1 full viewport scroll length
        scrub: true,
        pin: true,    // Locks the giant title in place
        anticipatePin: 1
      }
    });

    // Step A: As you scroll, the giant title fades out and scales up slightly
    tl.to("#giantTitle", {
      scale: 1.1,
      opacity: 0,
      ease: "power2.in"
    })
    // Step B: Simultaneously, the bottom 3-image section lifts up over the hero
    .fromTo("#revealContent", 
      { yPercent: 100 }, 
      { yPercent: 0, ease: "none" }, 
      0
    );
  </script>
</body>
</html>
