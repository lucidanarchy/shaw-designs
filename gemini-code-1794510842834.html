<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Architectural Hero Scroll Reveal Example</title>

  <!-- Google Fonts: Cormorant Garamond & Work Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Work+Sans:wght@300;400&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Lenis CSS -->
  <link rel="stylesheet" href="https://unpkg.com/lenis@1.1.18/dist/lenis.css">

  <style>
    body {
      background-color: #0a0a0a;
      color: #f5f5f5;
      font-family: 'Work Sans', sans-serif;
    }

    .font-editorial {
      font-family: 'Cormorant Garamond', serif;
    }

    /* =========================================================
       HERO SCROLL REVEAL STYLES
       ========================================================= */
    .hero-reveal-section {
      position: relative;
      height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 0 2rem;
    }

    .hero-reveal-box {
      position: relative;
      width: 100%;
      height: 85vh;
      max-width: 1400px;
      overflow: hidden;
      /* Initial clipped state before scroll */
      clip-path: inset(10% 10% 10% 10%);
      will-change: clip-path, transform;
    }

    .hero-reveal-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.15); /* Slight initial zoom for depth */
      will-change: transform;
    }

    .hero-content-overlay {
      position: absolute;
      z-index: 10;
      text-align: center;
      pointer-events: none;
    }

    .next-section {
      height: 100vh;
      background-color: #121212;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <!-- =========================================================
       HERO SECTION WITH SCROLL REVEAL MASK
       ========================================================= -->
  <section class="hero-reveal-section">
    <div class="hero-content-overlay">
      <span class="text-uppercase text-white-50 tracking-widest small d-block mb-2" style="letter-spacing: 0.3em;">Digital Monograph</span>
      <h1 class="font-editorial display-4 text-white fw-light">Architecture in Silence</h1>
    </div>

    <!-- The Box that unmasks on scroll -->
    <div class="hero-reveal-box" id="heroRevealBox">
      <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1600&auto=format&fit=crop" class="hero-reveal-img" id="heroRevealImg" alt="Luxury Interior Architecture">
    </div>
  </section>

  <!-- NEXT SECTION (To allow scrolling) -->
  <section class="next-section">
    <div class="text-center">
      <h2 class="font-editorial fw-light display-5">Scroll Experience Active</h2>
      <p class="text-secondary">The image smoothly expands to full viewport width as you scroll.</p>
    </div>
  </section>

  <!-- GSAP & ScrollTrigger CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  
  <!-- Lenis CDN -->
  <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>

  <script>
    // 1. Initialize Lenis Smooth Scroll
    const lenis = new Lenis({
      duration: 1.2,
      smoothWheel: true,
    });

    lenis.on('scroll', ScrollTrigger.update);
    gsap.ticker.add((time) => { lenis.raf(time * 1000); });
    gsap.ticker.lagSmoothing(0);

    // 2. GSAP ScrollTrigger Reveal Animation
    gsap.registerPlugin(ScrollTrigger);

    gsap.to("#heroRevealBox", {
      clipPath: "inset(0% 0% 0% 0%)", // Fully opens up to edges
      ease: "none",
      scrollTrigger: {
        trigger: ".hero-reveal-section",
        start: "top top",
        end: "+=100%", // Pins/Scrubs across 1 full viewport height of scrolling
        scrub: true,
        pin: true,    // Locks the section while the image expands
      }
    });

    gsap.to("#heroRevealImg", {
      scale: 1, // Settles down the initial 1.15 zoom
      ease: "none",
      scrollTrigger: {
        trigger: ".hero-reveal-section",
        start: "top top",
        end: "+=100%",
        scrub: true,
      }
    });
  </script>
</body>
</html>
